name: CI Pipeline

on:
  push:
    branches: [main, develop, divyanshi-branch]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Migrate, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: codeone_user
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: codeone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U codeone_user -d codeone_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://codeone_user:ci-test-password@localhost:5432/codeone_test
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-must-be-at-least-32-chars
      COOKIE_SECRET: ci-test-cookie-secret-must-be-at-least-32-chars

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=server

      - name: Run Prisma Migrations
        working-directory: server
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Typecheck server
        run: npm run typecheck --workspace=server

      - name: Lint
        run: npm run lint

      - name: Test server
        run: npm test --workspace=server
